<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Sama AI</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .thank-you-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--accent-blue);
            margin-bottom: 20px;
        }

        p {
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>

<body class="dark-theme">
    <canvas id="bg-canvas"></canvas>

    <div class="thank-you-container fade-in">
        <h1>Thank You!</h1>
        <p>We have received your submission. Our team will get in touch with you shortly.</p>
        <a href="index.html" class="cta-button primary">Back to Home</a>
    </div>

    <script src="script.js"></script>
</body>

</html>
