<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama – Demo Dashboard</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@700&display=swap" rel="stylesheet">

    <style>
        /* ── Page layout ────────────────────────── */
        .dashboard-wrapper {
            min-height: 100vh;
            position: relative;
            padding-top: 100px;
        }

        .dashboard-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px 80px;
            position: relative;
            z-index: 1;
        }

        .dashboard-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .dashboard-title h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .dashboard-title p {
            font-size: 1.15rem;
            opacity: 0.55;
            line-height: 1.6;
        }

        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(66, 133, 244, 0.08);
            border: 1px solid rgba(66, 133, 244, 0.15);
            border-radius: 9999px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4285F4;
            margin-bottom: 24px;
        }

        /* ── Title row with toggle ─────────────── */
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .title-row h1 {
            margin-bottom: 0;
        }

        .view-toggle {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 9999px;
            padding: 3px;
            gap: 2px;
            flex-shrink: 0;
        }

        .view-toggle-btn {
            padding: 6px 18px;
            border-radius: 9999px;
            border: none;
            background: transparent;
            color: rgba(18, 19, 23, 0.4);
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .view-toggle-btn.active {
            background: #4285F4;
            color: #fff;
        }

        /* ── List view ──────────────────────────── */
        #list-placeholder {
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid rgba(66, 133, 244, 0.2);
            border-radius: 24px;
            height: 600px;
            overflow-y: scroll;
            scrollbar-width: none;
            display: none;
        }

        #list-placeholder::-webkit-scrollbar { display: none; }

        .list-inner { padding: 12px 0; }

        .list-day-group { padding: 0 28px; }

        .list-day-group.is-past { opacity: 0.5; }

        .list-day-header {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #121317;
            padding: 20px 0 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 8px;
        }

        .list-day-group.is-today .list-day-header { color: #4285F4; }

        .list-task-row {
            padding: 12px 14px;
            background: rgba(66, 133, 244, 0.05);
            border: 1px solid rgba(66, 133, 244, 0.15);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #121317;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .list-task-time {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.45;
            flex-shrink: 0;
        }

        .list-no-tasks {
            font-size: 0.875rem;
            color: rgba(18, 19, 23, 0.35);
            padding: 10px 0 8px;
        }

        /* ── Calendar card ──────────────────────── */
        .cal-card {
            background: #fff;
            border-radius: 24px;
            border: 1px solid rgba(66, 133, 244, 0.2);
            padding: 36px;
            max-width: 860px;
            margin: 0 auto;
            transition: box-shadow 0.3s ease;
        }

        /* ── Weekday headers ────────────────────── */
        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 8px;
        }

        .cal-weekday {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.35;
            padding: 8px 0;
        }

        /* ── Day grid ───────────────────────────── */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day {
            min-height: 80px;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .cal-day:hover {
            background: rgba(66, 133, 244, 0.06);
            transform: translateY(-2px);
        }

        .cal-day.other-month {
            opacity: 0.25;
            cursor: default;
        }

        .cal-day.other-month:hover {
            background: transparent;
            transform: none;
        }

        /* Today highlight — accent circle around the number */
        .cal-day-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 500;
            flex-shrink: 0;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .cal-day.today .cal-day-num {
            background: #4285F4;
            color: #fff;
            font-weight: 700;
        }

        /* ── Task pills ─────────────────────────── */
        .cal-task-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.68rem;
            font-weight: 500;
            background: rgba(66, 133, 244, 0.1);
            color: #4285F4;
            border: 1px solid rgba(66, 133, 244, 0.2);
            overflow: hidden;
            line-height: 1.6;
            max-width: 100%;
        }

        .cal-task-pill-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .cal-task-pill-time {
            flex-shrink: 0;
            opacity: 0.6;
            font-weight: 400;
        }

        .cal-task-overflow {
            display: block;
            padding: 2px 8px;
            font-size: 0.68rem;
            font-weight: 600;
            color: rgba(18, 19, 23, 0.4);
        }

        /* ── Nav bar (below grid) ───────────────── */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .cal-nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: transparent;
            color: #121317;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            font-family: inherit;
        }

        .cal-nav-btn:hover {
            transform: scale(1.05);
            background: rgba(66, 133, 244, 0.06);
            border-color: rgba(66, 133, 244, 0.3);
        }

        .cal-month-label {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            min-width: 160px;
            text-align: center;
        }

        /* ── Day detail modal ───────────────────── */
        .day-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(18, 19, 23, 0.4);
            backdrop-filter: blur(4px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .day-modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .day-modal-panel {
            background: #fff;
            border-radius: 24px;
            padding: 36px;
            width: 90%;
            max-width: 420px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 50px rgba(66, 133, 244, 0.2);
        }

        .day-modal-overlay.active .day-modal-panel {
            transform: translateY(0);
        }

        .day-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.06);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #121317;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .day-modal-close:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .day-modal-date {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            padding-right: 40px;
        }

        .day-modal-empty {
            text-align: center;
            padding: 32px 0;
            opacity: 0.35;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .day-modal-task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-modal-task-item {
            padding: 14px 18px;
            background: rgba(66, 133, 244, 0.05);
            border: 1px solid rgba(66, 133, 244, 0.15);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #121317;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .day-modal-task-time {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.45;
            flex-shrink: 0;
        }

        /* ── Session overlay (existing, kept) ───── */
        .session-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .session-overlay.active {
            display: block;
            opacity: 1;
        }

        .session-close {
            position: absolute;
            top: 30px; right: 30px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2100;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }

        .session-close:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* ── Responsive ─────────────────────────── */
        @media (max-width: 600px) {
            .cal-card { padding: 20px 16px; }
            .cal-day { min-height: 60px; padding: 6px 4px; }
            .cal-task-pill { display: none; }
        }

    </style>
</head>

<body class="light-theme">
    <header class="sticky-header">
        <div style="display:flex; align-items:center; gap:14px;">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
            <a href="/" class="logo" style="text-decoration:none; color:inherit;">sama</a>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
            <a href="contact.html" class="cta-button small">Contact Us</a>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <div class="dashboard-content">

            <div class="dashboard-title">
                <div class="demo-badge">Demo Dashboard</div>
                <div class="title-row">
                    <h1>Your Schedule</h1>
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" data-view="calendar">Calendar</button>
                        <button class="view-toggle-btn" data-view="list">List</button>
                    </div>
                </div>
                <p>View and manage your upcoming sessions.</p>
            </div>

            <!-- ── Calendar ────────────────────── -->
            <div class="cal-card" id="cal-card-wrapper">
                <!-- Weekday header row -->
                <div class="cal-weekdays">
                    <div class="cal-weekday">Sun</div>
                    <div class="cal-weekday">Mon</div>
                    <div class="cal-weekday">Tue</div>
                    <div class="cal-weekday">Wed</div>
                    <div class="cal-weekday">Thu</div>
                    <div class="cal-weekday">Fri</div>
                    <div class="cal-weekday">Sat</div>
                </div>

                <!-- Day cells — rendered by JS -->
                <div class="cal-grid" id="cal-grid"></div>

                <!-- Navigation below the grid -->
                <div class="cal-nav">
                    <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">&#8592;</button>
                    <span class="cal-month-label" id="cal-month-label"></span>
                    <button class="cal-nav-btn" id="cal-next" aria-label="Next month">&#8594;</button>
                </div>
            </div>

            <!-- ── List view placeholder ────────── -->
            <div id="list-placeholder"><div class="list-inner" id="list-inner"></div></div>

        </div>
    </div>

    <!-- Day detail modal -->
    <div class="day-modal-overlay" id="day-modal">
        <div class="day-modal-panel">
            <button class="day-modal-close" id="day-modal-close" aria-label="Close">&times;</button>
            <div class="day-modal-date" id="day-modal-date"></div>
            <div id="day-modal-body"></div>
        </div>
    </div>

    <div id="sidebar-mount"></div>

    <!-- Session overlay (existing) -->
    <div class="session-overlay" id="session-overlay">
        <button class="session-close" onclick="closeSession()">&times;</button>
        <div id="session-container" style="width:100%; height:100%;"></div>
    </div>

    <footer class="dark-footer" style="position:relative; z-index:1;">
        <p>&copy; 2026 Sama AI Technology</p>
    </footer>

    <script>
        /* ── Calendar ─────────────────────────────────────────── */

        /**
         * Future database hook — replace with an API call when tasks are persisted.
         * Return an array of { title: string } objects for the given date.
         */
        function getTasksForDate(year, month, day) {
            // TODO: replace with API/database call when backend is ready
            return [];
        }

        const MONTHS = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        const today = new Date();
        let viewYear  = today.getFullYear();
        let viewMonth = today.getMonth(); // 0-indexed

        function renderCalendar(year, month) {
            const grid  = document.getElementById('cal-grid');
            const label = document.getElementById('cal-month-label');

            label.textContent = `${MONTHS[month]} ${year}`;
            grid.innerHTML = '';

            const firstDay  = new Date(year, month, 1).getDay();   // 0=Sun
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev  = new Date(year, month, 0).getDate();

            // Leading days from previous month
            for (let i = firstDay - 1; i >= 0; i--) {
                const d = daysInPrev - i;
                const [py, pm] = month === 0 ? [year - 1, 11] : [year, month - 1];
                grid.appendChild(buildCell(py, pm, d, true));
            }

            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (
                    d === today.getDate() &&
                    month === today.getMonth() &&
                    year  === today.getFullYear()
                );
                grid.appendChild(buildCell(year, month, d, false, isToday));
            }

            // Trailing days to fill the last row
            const totalCells = firstDay + daysInMonth;
            const trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let d = 1; d <= trailing; d++) {
                const [ny, nm] = month === 11 ? [year + 1, 0] : [year, month + 1];
                grid.appendChild(buildCell(ny, nm, d, true));
            }
        }

        function buildCell(year, month, day, otherMonth, isToday = false) {
            const cell = document.createElement('div');
            cell.className = 'cal-day' +
                (otherMonth ? ' other-month' : '') +
                (isToday    ? ' today'       : '');

            const numEl = document.createElement('div');
            numEl.className = 'cal-day-num';
            numEl.textContent = day;
            cell.appendChild(numEl);

            if (!otherMonth) {
                const tasks = getTasksForDate(year, month + 1, day); // month+1 for 1-indexed
                tasks.sort((a, b) => {
                    const toMins = t => {
                        if (!t.time) return -1;
                        const [time, period] = t.time.split(' ');
                        let [h, m] = time.split(':').map(Number);
                        if (period === 'PM' && h !== 12) h += 12;
                        if (period === 'AM' && h === 12) h = 0;
                        return h * 60 + m;
                    };
                    return toMins(a) - toMins(b);
                });
                const visible = tasks.slice(0, 2);
                const overflow = tasks.length - visible.length;

                visible.forEach(t => {
                    const pill = document.createElement('span');
                    pill.className = 'cal-task-pill';
                    pill.innerHTML = `<span class="cal-task-pill-title">${t.title}</span>` +
                        (t.time ? `<span class="cal-task-pill-time">${t.time}</span>` : '');
                    cell.appendChild(pill);
                });

                if (overflow > 0) {
                    const more = document.createElement('span');
                    more.className = 'cal-task-overflow';
                    more.textContent = `+${overflow} more`;
                    cell.appendChild(more);
                }

                cell.addEventListener('click', () => openDayModal(year, month, day, tasks));
            }

            return cell;
        }

        /* ── Day modal ──────────────────────────────────────────── */
        function openDayModal(year, month, day, tasks) {
            const overlay   = document.getElementById('day-modal');
            const dateLabel = document.getElementById('day-modal-date');
            const body      = document.getElementById('day-modal-body');

            const dateObj = new Date(year, month, day);
            dateLabel.textContent = dateObj.toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            if (tasks.length === 0) {
                body.innerHTML = '<div class="day-modal-empty">No sessions scheduled<br>for this day.</div>';
            } else {
                const list = document.createElement('div');
                list.className = 'day-modal-task-list';
                tasks.forEach(t => {
                    const item = document.createElement('div');
                    item.className = 'day-modal-task-item';
                    item.innerHTML = `<span>${t.title}</span>` +
                        (t.time ? `<span class="day-modal-task-time">${t.time}</span>` : '');
                    list.appendChild(item);
                });
                body.innerHTML = '';
                body.appendChild(list);
            }

            overlay.classList.add('active');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('active');
        }

        document.getElementById('day-modal-close').addEventListener('click', closeDayModal);
        document.getElementById('day-modal').addEventListener('click', function (e) {
            if (e.target === this) closeDayModal();
        });

        /* ── Navigation ─────────────────────────────────────────── */
        document.getElementById('cal-prev').addEventListener('click', () => {
            if (viewMonth === 0) { viewMonth = 11; viewYear--; }
            else viewMonth--;
            renderCalendar(viewYear, viewMonth);
        });

        document.getElementById('cal-next').addEventListener('click', () => {
            if (viewMonth === 11) { viewMonth = 0; viewYear++; }
            else viewMonth++;
            renderCalendar(viewYear, viewMonth);
        });

        renderCalendar(viewYear, viewMonth);

        /* ── List view ──────────────────────────────────────────── */
        (function () {
            const calCard   = document.getElementById('cal-card-wrapper');
            const listWrap  = document.getElementById('list-placeholder');
            const listInner = document.getElementById('list-inner');
            const buttons   = document.querySelectorAll('.view-toggle-btn');

            const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

            // Same time-to-minutes logic used in buildCell sort
            function timeToMins(t) {
                if (!t.time) return -1;
                const [time, period] = t.time.split(' ');
                let [h, m] = time.split(':').map(Number);
                if (period === 'PM' && h !== 12) h += 12;
                if (period === 'AM' && h === 12) h = 0;
                return h * 60 + m;
            }

            function dateKey(d) {
                return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            }

            let lastRenderedDate = null;
            let todayGroupEl = null;

            function renderListView() {
                const now           = new Date();
                const todayKey      = dateKey(now);
                const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                lastRenderedDate = now.toDateString();

                // Collect days: today always included, plus any day with tasks in ±180 window
                const dayMap = {};
                for (let offset = -180; offset <= 180; offset++) {
                    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
                    const k = dateKey(d);
                    const tasks = getTasksForDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
                    if (tasks.length > 0 || k === todayKey) {
                        dayMap[k] = { date: new Date(d), tasks };
                    }
                }

                // Sort chronologically
                const sorted = Object.values(dayMap).sort((a, b) => a.date - b.date);

                listInner.innerHTML = '';
                todayGroupEl = null;

                sorted.forEach(({ date, tasks }) => {
                    const k       = dateKey(date);
                    const isToday = k === todayKey;
                    const isPast  = date < todayMidnight;

                    const group = document.createElement('div');
                    group.className = 'list-day-group' +
                        (isToday ? ' is-today' : '') +
                        (isPast  ? ' is-past'  : '');
                    if (isToday) todayGroupEl = group;

                    // Date header: "Monday, May 18"
                    const header = document.createElement('div');
                    header.className = 'list-day-header';
                    header.textContent = `${DAYS[date.getDay()]}, ${MONTHS[date.getMonth()]} ${date.getDate()}`;
                    group.appendChild(header);

                    if (tasks.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'list-no-tasks';
                        empty.textContent = 'No tasks today';
                        group.appendChild(empty);
                    } else {
                        // Sort tasks by time ascending
                        tasks.slice().sort((a, b) => timeToMins(a) - timeToMins(b)).forEach(t => {
                            const row = document.createElement('div');
                            row.className = 'list-task-row';
                            row.innerHTML = `<span>${t.title}</span>` +
                                (t.time ? `<span class="list-task-time">${t.time}</span>` : '');
                            group.appendChild(row);
                        });
                    }

                    listInner.appendChild(group);
                });
            }

            function anchorToToday() {
                if (!todayGroupEl) return;
                const containerHeight = listWrap.clientHeight;
                const targetScroll = todayGroupEl.offsetTop - listWrap.offsetTop - Math.floor(containerHeight / 3);
                listWrap.scrollTop = Math.max(0, targetScroll);
            }

            function setView(view) {
                calCard.style.display  = view === 'calendar' ? '' : 'none';
                listWrap.style.display = view === 'list'     ? 'block' : 'none';
                buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
                // TODO: migrate to user profile preference when auth is added
                localStorage.setItem('sama_view_preference', view);
                if (view === 'list') {
                    renderListView();
                    // Use rAF to ensure layout is painted before measuring offsetTop
                    requestAnimationFrame(anchorToToday);
                }
            }

            buttons.forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));

            // Midnight auto-update: re-render if the date has changed
            setInterval(() => {
                if (new Date().toDateString() !== lastRenderedDate) {
                    renderListView();
                    requestAnimationFrame(anchorToToday);
                }
            }, 60000);

            // Restore last selected view on page load
            const saved = localStorage.getItem('sama_view_preference') || 'calendar';
            setView(saved);
        })();

        /* ── Session overlay (existing) ─────────────────────────── */
        function closeSession() {
            const overlay = document.getElementById('session-overlay');
            const container = document.getElementById('session-container');
            overlay.classList.remove('active');
            container.innerHTML = '';
        }
    </script>
    <script src="js/components/sidebar.js"></script>
</body>

</html>
