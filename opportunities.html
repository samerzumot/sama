    <style>
        .dashboard-wrapper {
            min-height: 100vh;
            position: relative;
            padding-top: 100px;
        }

        .dashboard-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px 80px;
            position: relative;
            z-index: 1;
        }

        .dashboard-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .dashboard-title h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        /* ── Sidebar ────────────────────────────── */
        .sidebar-toggle {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }

        .sidebar-toggle span {
            display: block;
            height: 2px;
            width: 22px;
            background: #121317;
            border-radius: 2px;
            transition: opacity 0.2s;
        }

        .sidebar-toggle:hover span { opacity: 0.5; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(18, 19, 23, 0.4);
            backdrop-filter: blur(4px);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: #fff;
            z-index: 600;
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 4px 0 24px rgba(0,0,0,0.08);
        }

        .sidebar.active { transform: translateX(0); }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .sidebar-logo {
            font-family: 'MuseoModerno', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.03em;
            color: #121317;
        }

        .sidebar-close {
            background: rgba(0,0,0,0.06);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #121317;
            transition: background 0.2s;
            font-family: inherit;
        }

        .sidebar-close:hover { background: rgba(0,0,0,0.12); }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 9999px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(18,19,23,0.6);
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-link:hover {
            background: rgba(0,0,0,0.05);
            color: #121317;
        }

        .sidebar-link.active {
            background: #121317;
            color: #fff;
        }

        .sidebar-link svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body class="light-theme">

    <script>
        /* ── Particle canvas ── */
        (function () {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            let mouse = { x: -1000, y: -1000 };
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 1;
                    this.baseAlpha = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    const dx = mouse.x - this.x, dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        const angle = Math.atan2(dy, dx);
                        const force = (150 - dist) / 150;
                        this.vx -= Math.cos(angle) * force * 0.1;
                        this.vy -= Math.sin(angle) * force * 0.1;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(66, 133, 244, ${this.baseAlpha * 1.2})`;
                    ctx.fill();
                }
            }
            function resize() {
                width = window.innerWidth; height = window.innerHeight;
                canvas.width = width; canvas.height = height;
                particles = [];
                for (let i = 0; i < Math.floor((width * height) / 15000); i++) particles.push(new Particle());
            }
            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            window.addEventListener('resize', resize);
            resize(); animate();
        })();

        /* ── Sidebar ── */
        (function () {
            const toggle  = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const close   = document.getElementById('sidebar-close');

            function openSidebar()  { sidebar.classList.add('active'); overlay.classList.add('active'); }
            function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }

            toggle.addEventListener('click', openSidebar);
            close.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);
        })();
    </script>
