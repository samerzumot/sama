<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama – Calendar</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@700&display=swap" rel="stylesheet">

    <style>
        .dashboard-wrapper {
            min-height: 100vh;
            position: relative;
            padding-top: 100px;
        }

        .dashboard-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px 80px;
            position: relative;
            z-index: 1;
        }

        .dashboard-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .dashboard-title h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

    </style>
</head>

<body class="light-theme">
    <header class="sticky-header">
        <div style="display:flex; align-items:center; gap:14px;">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
            <a href="/" class="logo" style="text-decoration:none; color:inherit;">sama</a>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
            <a href="contact.html" class="cta-button small">Contact Us</a>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <div class="dashboard-content">
            <div class="dashboard-title">
                <h1>Calendar</h1>
            </div>
        </div>
    </div>

    <div id="sidebar-mount"></div>

    <footer class="dark-footer" style="position:relative; z-index:1;">
        <p>&copy; 2026 Sama AI Technology</p>
    </footer>

    <script src="js/components/sidebar.js"></script>
</body>

</html>
