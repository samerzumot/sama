<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Using Google Sans Flex via Inter as proxy, or actually importing similar font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@700&display=swap" rel="stylesheet">
</head>

<body class="light-theme">
    <canvas id="bg-canvas"></canvas>

    <header class="sticky-header">
        <div class="logo">sama</div>
        <a href="contact.html" class="cta-button small">Contact Us</a>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-headline">
                    Your Future <br>
                    <span class="highlight">Secured.</span>
                </h1>
                <p class="hero-sub">
                    Personal <span id="rotating-word"
                        style="display:inline-block; font-weight:700; transition: opacity 0.35s ease, transform 0.35s ease;">counselling</span>,
                    reimagined.
                </p>
                <div class="hero-actions">
                    <a href="#demo" class="cta-button primary">Meet our CEO</a>
                    <a href="dashboard.html" class="cta-button secondary">Try Now</a>
                    <a href="eq-insights.html" class="cta-button secondary">EQ Insights</a>
                    <a href="demodashboard.html" class="cta-button secondary">Dashboard</a>
                </div>
            </div>
        </section>

        <!-- Spacer for scroll transition -->
        <div class="scroll-spacer"></div>

        <section id="demo" class="video-demo-section dark-section">
            <h2 class="section-title fade-in" style="margin-bottom: 40px; font-size: 2rem;">Meet our CEO</h2>
            <div class="video-container fade-in" id="ceo-video-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 450px; background: #000; border-radius: 24px; position: relative; overflow: hidden;">
                <div class="video-overlay" id="ceo-overlay" style="text-align: center; z-index: 10;">
                    <button class="cta-button primary" onclick="startCeoSession()" id="ceo-connect-btn">Connect with CEO</button>
                    <p class="overlay-sub" style="margin-top: 16px; opacity: 0.7; color: #fff;">Start a live video conversation</p>
                </div>
                <div id="ceo-iframe-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none;"></div>
            </div>
        </section>

        <!-- Sections removed as requested -->
    </main>

    <footer class="dark-footer">
        <p>&copy; 2026 Sama AI Technology</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
